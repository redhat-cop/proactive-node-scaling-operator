version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns:
          - 'k8s.io/*'
          - sigs.k8s.io/controller-runtime
          - github.com/redhat-cop/operator-utils
  - package-ecosystem: gomod
    directory: /tools/kube-rbac-proxy
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
