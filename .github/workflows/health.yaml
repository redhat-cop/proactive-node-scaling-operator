name: repository health

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.10', '1.27.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Regenerate manifests and code
        run: |
          make manifests generate
          git diff --exit-code -- api config
      - name: Render deployment manifests
        run: |
          make kustomize
          bin/kustomize build config/default > /tmp/deployment.yaml
      - name: Dependencies, vet, build, and unit tests
        run: make health
      - name: Known vulnerabilities in imported Go packages
        run: make security
      - name: CRD API integration test
        run: make test-integration
      - name: Check dependency manifests were not changed
        run: git diff --exit-code -- go.mod go.sum tools/kube-rbac-proxy/go.mod tools/kube-rbac-proxy/go.sum

  image:
    name: Container build and security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build runtime image
        run: docker build --pull -t proactive-node-scaling-operator:ci .
      - name: Check bundled metrics proxy command
        run: docker run --rm --entrypoint /kube-rbac-proxy proactive-node-scaling-operator:ci --help
      - name: Scan runtime OS packages
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.0
          image-ref: proactive-node-scaling-operator:ci
          scanners: vuln
          vuln-type: os
          exit-code: '1'
      - name: Report all image dependency advisories
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.0
          image-ref: proactive-node-scaling-operator:ci
          scanners: vuln
          exit-code: '0'
